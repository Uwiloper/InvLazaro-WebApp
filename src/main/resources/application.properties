spring.application.name=inversioneslazaro

spring.web.locale=es_PE
spring.mvc.locale=es_PE

spring.datasource.url=jdbc:mysql://{Database}?serverTimeZone=America/Lima
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

storage.location=mediafiles

# Establece el tama�o m�ximo por CADA archivo (ej: 10 Megabytes)
spring.servlet.multipart.max-file-size=10MB

# Establece el tama�o m�ximo de la PETICI�N TOTAL (debe ser >= al de arriba)
spring.servlet.multipart.max-request-size=10MB

#app.uploads.path=uploads

#Tiempo de inactividad de sesi�n en segundos (ejemplo: 2 horas = 7200 segundos)
server.servlet.session.timeout=7200s

# Configuraci�n del servidor de correo (ejemplo con Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username={correo}
spring.mail.password={key}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Aumentar el tiempo de espera (en milisegundos)
# Permite hasta 30 segundos para conectar y 30 segundos para leer/escribir
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

